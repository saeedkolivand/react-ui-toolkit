name: Release

# Manual only. Merging to main does not publish — releases are cut on demand from
# the Actions tab, so a refactor can land across many commits and ship as one
# release when it is actually ready. semantic-release still derives the version
# from every commit since the last tag, so batching costs nothing.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit + tag
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # OIDC — npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history to read tags
          persist-credentials: false

      # Node 24 ships npm 11.x, which is what performs the OIDC token exchange
      # at publish time. No dependency cache: this job produces the published
      # artifact, so it installs from the lockfile and nothing else.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - name: Verify before releasing
        run: |
          npm run lint
          npm run typecheck
          npm test

      # Authenticates to npm via OIDC trusted publishing — there is deliberately
      # no NPM_TOKEN. A token is not just unnecessary here, it is harmful: if the
      # OIDC exchange ever fails, semantic-release falls back to token auth, and
      # a token that enforces 2FA dies at `npm publish` — which runs *after*
      # semantic-release has already pushed the tag. That is exactly how v1.0.0
      # ended up tagged on main while npm stayed at 0.1.18, twice. With no token
      # to fall back to, a broken OIDC setup fails in verifyConditions instead,
      # before anything is tagged or committed.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
