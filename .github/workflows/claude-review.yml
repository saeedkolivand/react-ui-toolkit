name: Claude Review

# Reviews a PR only when asked. Comment `@claude` on the PR — either a normal
# comment or an inline review comment — and the review runs against that PR.
#
# Nothing triggers automatically: no review on open, on push, or on a schedule.
#
# Note that GitHub only runs `issue_comment` workflows from the version of this
# file on the default branch, so the mention has no effect until this is merged
# — including on PRs that were opened before it landed.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# A second mention while a review is still running supersedes the first.
concurrency:
  group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Three conditions, all required:
    #   1. the comment is on a pull request, not a plain issue
    #   2. it mentions @claude
    #   3. it came from someone with write access
    #
    # The third matters because this repository is public and the job runs with
    # an API key attached. Without it, anyone who can type a comment can spend
    # money here.
    if: >-
      (github.event_name == 'pull_request_review_comment' ||
       github.event.issue.pull_request != null) &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the review can diff against the base branch.
          fetch-depth: 0

      # `issue_comment` checks out the default branch, not the PR — so without
      # this the review would read main and find nothing.
      - run: gh pr checkout "$PR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ env.PR }}"
          # Opus because the things worth catching in this repository are
          # cross-framework divergence and hand-rolled behaviour bugs, and both
          # need the whole diff held in mind at once. This is the cost knob.
          claude_args: "--model opus --max-turns 40"
