name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --affected diffs against the merge base; without full history
          # it silently falls back to running everything (slow, not wrong).
          fetch-depth: 0

      - uses: pnpm/action-setup@v6 # reads packageManager from package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Local turbo cache across runs. Remote caching (TURBO_TOKEN) is the
      # upgrade path; deliberately deferred past v1.0 for a solo maintainer.
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Lint, typecheck, build, test
        run: pnpm turbo run lint typecheck build test --affected

      # Catches broken exports maps, missing files and type-resolution problems
      # before they reach npm, where they are unfixable without a new version.
      - name: Validate published package shape
        run: pnpm turbo run check:exports --affected

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Not fatal: forks and Dependabot PRs cannot read CODECOV_TOKEN.
          fail_ci_if_error: false

  # The cross-framework parity suite. This is the one check that can catch an
  # adapter diverging from the other three — every bug it has found so far
  # passed lint, typecheck, build and the unit tests first. Deliberately NOT
  # --affected: a change to @crosskit-ui/styles or /core affects all four
  # adapters, and turbo cannot know that a CSS edit moved one framework's box.
  parity:
    name: Cross-framework parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The playgrounds import each adapter's dist, so a stale build means the
      # suite tests the previous commit — which has already happened once, and
      # produced a page of meaningless results.
      - name: Build packages
        run: pnpm turbo run build --filter="./packages/*"

      - name: Install Playwright Chromium
        run: pnpm --filter @crosskit-ui/e2e exec playwright install --with-deps chromium

      - name: Run parity suite
        run: pnpm --filter @crosskit-ui/e2e test:e2e

      # The positioner suite runs separately because it is framework-free: one
      # server, its own baseURL, no adapters involved. It is the gate on the
      # geometry every overlay component will depend on, so it belongs in CI
      # rather than only in a developer's terminal.
      - name: Run positioner suite
        run: pnpm --filter @crosskit-ui/e2e test:position

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: parity-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Versions now come from changeset files, NOT from commit messages —
      # changesets replaced semantic-release. Conventional Commits are still
      # enforced because the changelog and the history read better for it.
      - name: Validate commit messages
        run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose
