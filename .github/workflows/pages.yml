name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy site
    runs-on: ubuntu-latest
    permissions:
      contents: read # only reads the repo — the site is no longer a branch
      pages: write # deploy to the Pages service
      id-token: write # OIDC, required by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The landing page imports the library's own components, so build the
      # library (and therefore dist/styles.css) first.
      - name: Build library
        run: npm run build

      - name: Build landing page
        run: npm run build:landing

      - name: Build Storybook
        run: npm run build-storybook
        env:
          STORYBOOK_BASE_PATH: /storybook/

      # Landing page at the site root, Storybook one level down. No .nojekyll
      # needed: artifact deploys skip Jekyll entirely, so Vite's _-prefixed
      # asset directories survive on their own.
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r landing-dist/. site/
          mkdir -p site/storybook
          cp -r storybook-static/. site/storybook/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
