name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    name: Build and deploy site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write # OIDC, required by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # turbo resolves the graph: every package builds before docs and Storybook.
      # Base paths are "/" and "/storybook/" because the site is served from the
      # custom domain crosskit.iamsaeed.dev, not a github.io subpath.
      - name: Build site
        run: pnpm turbo run build
        env:
          DOCS_BASE: /
          STORYBOOK_BASE_PATH: /storybook/

      # No .nojekyll needed: artifact deploys skip Jekyll entirely, so Vite's
      # _-prefixed asset directories survive on their own.
      - name: Assemble site
        run: |
          mkdir -p site
          if [ -d apps/docs/dist ]; then cp -r apps/docs/dist/. site/; fi
          if [ -d apps/storybook/storybook-static ]; then
            mkdir -p site/storybook
            cp -r apps/storybook/storybook-static/. site/storybook/
          fi
          # Fail loudly rather than deploying an empty site.
          test -n "$(ls -A site)" || { echo "::error::site/ is empty — no docs or storybook build output"; exit 1; }
          # And loudly rather than deploying a Storybook whose preview cannot
          # load. Storybook's MANAGER uses relative ./sb-manager/ paths and
          # renders whatever the base path is, while the PREVIEW emits absolute
          # asset URLs from it — so a base that never reached the build looks
          # like a working sidebar over a pane that spins forever. Nothing else
          # in CI can see that, because the build itself succeeds.
          if [ -f site/storybook/iframe.html ]; then
            grep -q '"/storybook/assets/' site/storybook/iframe.html || {
              echo "::error::Storybook preview assets are not under /storybook/ — STORYBOOK_BASE_PATH did not reach the build (turbo runs tasks in strict env mode; the variable must be listed in turbo.json's build task)"
              grep -oE 'src="[^"]*iframe[^"]*"' site/storybook/iframe.html || true
              exit 1
            }
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
